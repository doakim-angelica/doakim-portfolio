<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:24px}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px;font-size:12px}
  .row:last-child{margin-bottom:0}
  .tag{font-family:var(--font-mono);width:52px;color:var(--fg-2);flex:none}
  .px{font-family:var(--font-mono);width:48px;color:var(--fg-3);flex:none}
  .bar{height:14px;background:var(--accent);border-radius:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="tag">sp-1</span><span class="px">4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="tag">sp-2</span><span class="px">8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="tag">sp-3</span><span class="px">12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="tag">sp-4</span><span class="px">16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="tag">sp-5</span><span class="px">24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="tag">sp-6</span><span class="px">32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="tag">sp-7</span><span class="px">48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="tag">sp-8</span><span class="px">64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="tag">sp-9</span><span class="px">96</span><span class="bar" style="width:96px"></span></div>
  <div class="row"><span class="tag">sp-10</span><span class="px">128</span><span class="bar" style="width:128px"></span></div>
</div>
</body>
</html>
