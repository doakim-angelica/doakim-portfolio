<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:28px 24px;display:flex;align-items:center;gap:40px}
  .word{font-weight:800;font-size:40px;letter-spacing:-0.03em;display:flex;align-items:flex-end;gap:8px}
  .word i{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-bottom:9px}
  .mono{width:72px;height:72px;border-radius:16px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;position:relative;font-weight:800;font-size:30px;letter-spacing:-0.02em}
  .mono i{position:absolute;top:16px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .t{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div><div class="word">DOA KIM<i></i></div><div class="t">wordmark</div></div>
  <div><div class="mono">DK<i></i></div><div class="t">monogram</div></div>
</div>
</body>
</html>
