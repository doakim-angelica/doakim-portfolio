<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:24px}
  .row{display:flex;gap:14px;align-items:stretch}
  .big{flex:1.4;border-radius:var(--r-md);background:#00BBA9;color:var(--on-accent);padding:16px;display:flex;flex-direction:column;justify-content:space-between}
  .big .n{font-weight:700;font-size:15px}
  .big .h{font-family:var(--font-mono);font-size:12px;opacity:.7}
  .col{flex:1;display:flex;flex-direction:column;gap:10px}
  .sw{flex:1;border-radius:var(--r-sm);border:1px solid var(--line-2);display:flex;align-items:center;padding:0 12px;gap:10px;font-size:12px}
  .sw .h{font-family:var(--font-mono);color:var(--fg-3);font-size:11px;margin-left:auto}
  .tile{width:18px;height:18px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="big">
      <div class="n">accent · teal</div>
      <div class="h">#00BBA9</div>
    </div>
    <div class="col">
      <div class="sw"><span class="tile" style="background:#1ED9C6"></span>accent-bright<span class="h">#1ED9C6</span></div>
      <div class="sw"><span class="tile" style="background:#00A294"></span>accent-press<span class="h">#00A294</span></div>
      <div class="sw" style="background:rgba(0,187,169,0.14)"><span class="tile" style="background:rgba(0,187,169,0.14);border:1px solid var(--accent)"></span>accent-dim<span class="h">14%</span></div>
      <div class="sw"><span class="tile" style="background:#003832"></span>accent-ink<span class="h">#003832</span></div>
    </div>
  </div>
</div>
</body>
</html>
