<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:28px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:15px;font-weight:600;border-radius:var(--r-md);padding:13px 22px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;letter-spacing:-0.01em}
  .primary{background:var(--accent);color:var(--on-accent)}
  .secondary{background:transparent;color:var(--fg-1);border-color:var(--line-3)}
  .ghost{background:transparent;color:var(--fg-2);padding:13px 12px}
  .link{background:none;border:none;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer}
  .arrow{font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <button class="btn primary">Start a project <span class="arrow">→</span></button>
  <button class="btn secondary">See the work</button>
  <button class="btn ghost">About</button>
  <button class="link">Read more →</button>
</div>
</body>
</html>
