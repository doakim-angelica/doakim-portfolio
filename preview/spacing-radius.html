<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:24px;display:flex;gap:18px;align-items:flex-end}
  .cell{text-align:center}
  .box{width:84px;height:64px;background:var(--bg-3);border:1px solid var(--line-2);border-top:2px solid var(--accent)}
  .t{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-top:10px}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="t">r-xs</div><div class="px">4px</div></div>
  <div class="cell"><div class="box" style="border-radius:8px"></div><div class="t">r-sm</div><div class="px">8px</div></div>
  <div class="cell"><div class="box" style="border-radius:12px"></div><div class="t">r-md</div><div class="px">12px</div></div>
  <div class="cell"><div class="box" style="border-radius:16px"></div><div class="t">r-lg</div><div class="px">16px</div></div>
  <div class="cell"><div class="box" style="border-radius:24px"></div><div class="t">r-xl</div><div class="px">24px</div></div>
  <div class="cell"><div class="box" style="width:64px;border-radius:999px"></div><div class="t">r-pill</div><div class="px">full</div></div>
</div>
</body>
</html>
