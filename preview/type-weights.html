<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:26px 24px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 14px}
  .cell .w{font-size:32px;letter-spacing:-0.02em;line-height:1}
  .cell .t{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="cell"><div class="w" style="font-weight:100">Aa</div><div class="t">100 Thin</div></div>
    <div class="cell"><div class="w" style="font-weight:300">Aa</div><div class="t">300 Light</div></div>
    <div class="cell"><div class="w" style="font-weight:400">Aa</div><div class="t">400 Regular</div></div>
    <div class="cell"><div class="w" style="font-weight:500">Aa</div><div class="t">500 Medium</div></div>
    <div class="cell"><div class="w" style="font-weight:600">Aa</div><div class="t">600 SemiBold</div></div>
    <div class="cell"><div class="w" style="font-weight:700">Aa</div><div class="t">700 Bold</div></div>
    <div class="cell"><div class="w" style="font-weight:800">Aa</div><div class="t">800 ExtraBold</div></div>
    <div class="cell"><div class="w" style="font-weight:900">Aa</div><div class="t">900 Black</div></div>
  </div>
</div>
</body>
</html>
