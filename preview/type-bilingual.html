<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:26px 24px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .h{font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1;margin:0}
  .sub{font-size:15px;color:var(--fg-3);margin:8px 0 0}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="eyebrow">Selected work</div>
    <p class="h">Brand systems that travel.</p>
    <p class="sub">English — sentence case, lyrical.</p>
    <div class="tag">EN · primary</div>
  </div>
  <div>
    <div class="eyebrow">선택된 작업</div>
    <p class="h">멀리 가는 브랜드를 만듭니다.</p>
    <p class="sub">한국어 — 같은 Pretendard, 폰트 전환 없음.</p>
    <div class="tag">KO · 동일 패밀리</div>
  </div>
</div>
</body>
</html>
