<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:26px 24px;display:flex;flex-direction:column;gap:14px;max-width:640px}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
  .lead{font-size:21px;font-weight:400;line-height:1.6;color:var(--fg-2);margin:0}
  .body{font-size:17px;line-height:1.7;color:var(--fg-2);margin:0}
  .small{font-size:15px;color:var(--fg-2);margin:0}
  .cap{font-size:13px;color:var(--fg-3);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div><div class="tag">lead · 400</div><p class="lead">A designer working at the seam of brand and product.</p></div>
  <div><div class="tag">body · 400 / 1.7</div><p class="body">I build identity systems that hold together across every surface — from a business card to a launch film — without losing their nerve.</p></div>
  <div style="display:flex;gap:32px">
    <div><div class="tag">small</div><p class="small">15px secondary</p></div>
    <div><div class="tag">caption</div><p class="cap">13px meta · Seoul, 2026</p></div>
  </div>
</div>
</body>
</html>
