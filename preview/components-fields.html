<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:26px 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  label{display:block;font-size:12px;color:var(--fg-3);margin-bottom:8px;letter-spacing:.04em}
  .field{width:100%;box-sizing:border-box;background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:13px 14px;color:var(--fg-1);font-family:inherit;font-size:15px}
  .field::placeholder{color:var(--fg-3)}
  .field.focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,187,169,.28)}
  .hint{font-size:12px;color:var(--fg-3);margin-top:7px}
  textarea.field{resize:none;height:64px}
</style>
</head>
<body>
<div class="wrap">
  <div><label>Name · 이름</label><input class="field" placeholder="Your name"></div>
  <div><label>Email</label><input class="field focus" value="hello@doakim.kr"></div>
  <div style="grid-column:1/3"><label>Message · 메시지</label><textarea class="field" placeholder="Tell me about the project…"></textarea><div class="hint">Focus state uses the teal ring.</div></div>
</div>
</body>
</html>
