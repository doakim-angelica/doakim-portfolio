<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:26px 24px;display:flex;flex-direction:column;gap:16px}
  .line{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line-1);padding-bottom:14px}
  .line:last-child{border-bottom:none;padding-bottom:0}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:96px;flex:none}
  .h1{font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
  .h2{font-size:30px;font-weight:600;letter-spacing:-0.02em}
  .h3{font-size:24px;font-weight:600;letter-spacing:-0.02em}
  .h4{font-size:20px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="line"><span class="tag">h1 · 700</span><span class="h1">Selected work</span></div>
  <div class="line"><span class="tag">h2 · 600</span><span class="h2">About the practice</span></div>
  <div class="line"><span class="tag">h3 · 600</span><span class="h3">Identity &amp; art direction</span></div>
  <div class="line"><span class="tag">h4 · 600</span><span class="h4">오늘의 작업</span></div>
</div>
</body>
</html>
