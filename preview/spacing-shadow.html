<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:30px 24px;display:flex;gap:26px;align-items:center;justify-content:center}
  .cell{text-align:center}
  .box{width:96px;height:64px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px}
  .t{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,.4)"></div><div class="t">sh-1</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 4px 16px rgba(0,0,0,.45)"></div><div class="t">sh-2</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 12px 40px rgba(0,0,0,.55)"></div><div class="t">sh-3</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 28px 80px rgba(0,0,0,.62)"></div><div class="t">sh-4</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 0 0 3px rgba(0,187,169,.28)"></div><div class="t">ring</div></div>
</div>
</body>
</html>
