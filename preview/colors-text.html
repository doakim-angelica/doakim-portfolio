<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-0);font-family:var(--font-sans);color:var(--fg-1)}
  .wrap{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
  .stack > div{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .stack > div:last-child{margin-bottom:0}
  .dot{width:22px;height:22px;border-radius:var(--r-pill);border:1px solid var(--line-2);flex:none}
  .lbl{font-size:13px}
  .lbl b{font-weight:600}
  .lbl .h{font-family:var(--font-mono);color:var(--fg-3);font-size:11px}
  .samp{font-size:15px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="stack">
    <div><span class="dot" style="background:#F4F4F6"></span><span class="lbl"><b>fg-1</b> primary <span class="h">#F4F4F6</span></span></div>
    <div><span class="dot" style="background:#ABABB6"></span><span class="lbl"><b>fg-2</b> secondary <span class="h">#ABABB6</span></span></div>
    <div><span class="dot" style="background:#71717F"></span><span class="lbl"><b>fg-3</b> tertiary <span class="h">#71717F</span></span></div>
    <div><span class="dot" style="background:#4A4A56"></span><span class="lbl"><b>fg-4</b> faint <span class="h">#4A4A56</span></span></div>
  </div>
  <div>
    <p class="samp" style="margin:0;color:#F4F4F6">Brand systems that travel.</p>
    <p class="samp" style="margin:6px 0 0;color:#ABABB6">Identity, art direction, and the quiet systems behind them.</p>
    <p class="samp" style="margin:6px 0 0;color:#71717F">Seoul · 2026 — selected work</p>
  </div>
</div>
</body>
</html>
